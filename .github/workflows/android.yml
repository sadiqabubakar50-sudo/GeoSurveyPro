name: Build GeoSurvey Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GeoSurveyPro_Android_Prototype.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: unzip GeoSurveyPro_Android_Prototype.zip -d project

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoSurveyPro-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
